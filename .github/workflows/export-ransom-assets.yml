name: Export Ransom Assets

on:
  push:
    paths:
      - "RansomAssets.zip"
      - ".github/workflows/export-ransom-assets.yml"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package asset
        run: |
          mkdir -p export
          cp RansomAssets.zip export/RansomAssets.zip

      - name: Upload asset
        uses: actions/upload-artifact@v4
        with:
          name: ransom-assets-export
          path: export/RansomAssets.zip
          retention-days: 1
